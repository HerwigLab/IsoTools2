[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isotools"
authors = [
  { name="Matthias Lienhard", email="lienhard@molgen.mpg.de" },
  { name="Yalan Bi", email="yalan_bi@molgen.mpg.de" },
]
description = "Framework for the analysis of long read transcriptome sequencing data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "tqdm>=4.70.0",
    "intervaltree>=3.2.1",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "biopython>=1.87",
    "pysam>=0.24.0",
    "umap-learn>=0.5.12",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "pyhmmer>=0.12.1",
    "requests>=2.34.2",
    "CPAT>=3.0.5",
    "python-ternary>=1.0.8",
]

[project.scripts]
run_isotools = "isotools.run_isotools:main"

[project.optional-dependencies]
testing = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "mypy>=0.910",
    "flake8>=3.9",
    "tox>=3.24",
]

[project.urls]
Homepage = "https://github.com/HerwigLab/IsoTools2"
Documentation = "https://isotools.readthedocs.io/"
Repository = "https://github.com/HerwigLab/IsoTools2.git"
Issues = "https://github.com/HerwigLab/IsoTools2/issues"
Changelog = "https://github.com/HerwigLab/IsoTools2/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {file = ["VERSION.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=isotools"
testpaths = [
    "tests",
]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true