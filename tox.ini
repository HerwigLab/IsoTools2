[tox]
minversion = 4.0.0
envlist = py311, py312, py313, py314, flake8
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, flake8

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:flake8]
basepython = python3.14
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    black src tests
    flake8 --config=setup.cfg src tests